[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worcap-endmembers"
version = "1.0.0"
description = "Reproducible PPI workflow and review tools for TerraClass vegetation endmembers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow==22.0.0",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.9,<4",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "earthengine-api>=1.5,<2",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<7", "nbclient>=0.10,<1"]
test = ["pytest>=8,<9"]

[project.scripts]
worcap-endmembers = "worcap_endmembers.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
